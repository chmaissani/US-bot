name: رادار الأسهم الأمريكية

on:
  schedule:
    - cron: "*/30 13-23 * * 1-5"
    - cron: "0 6 * * 6"
  workflow_dispatch:
    inputs:
      force:
        description: "تشغيل فوري: scan = فحص المضاربة الآن، invest = تقرير الاستثمار الآن، all = الاثنين"
        type: choice
        options: ["", "scan", "invest", "all"]
        default: ""

permissions:
  contents: write

concurrency:
  group: stocks
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: متابعة التوصيات والفحص اليومي
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FORCE: ${{ inputs.force }}
        run: python bot.py
      - name: حفظ الحالة
        run: |
          git config user.name "stocks-bot"
          git config user.email "stocks-bot@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || (git commit -m "update state" && git pull --rebase && git push)
